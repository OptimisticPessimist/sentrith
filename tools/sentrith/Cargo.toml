[package]
name = "sentrith"
version = "0.2.0"
edition = "2021"
description = "Local guard, usage, and decision routing CLI for Sentrith"
license = "MIT"
publish = false

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[[bin]]
name = "sentrith"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
